<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYPO — Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body class="lesson-page">
<header class="app-header">
  <a class="brand" href="index.html">
    <span class="logo-wrap" id="logo"></span>
    <span class="brand-text"><span class="brand-name">TYPO</span><span class="brand-tagline" id="unit-label">LESSON</span></span>
  </a>
  <div class="header-right">
    <div class="pills">
      <span class="pill" title="Words per minute"><span>⚡</span><b id="live-wpm">0</b></span>
      <span class="pill" title="Accuracy"><span>🎯</span><b id="live-acc">100%</b></span>
      <span class="pill" title="Time"><span>⏱</span><b id="live-time">0:00</b></span>
    </div>
    <a class="btn btn-ghost btn-small exit-btn" href="index.html">✕ Exit</a>
  </div>
</header>

<main class="layout player">
  <section class="panel">
    <div class="lesson-head">
      <div><small class="eyebrow" id="unit-eyebrow">Unit</small><h1 class="panel-title small" id="lesson-label">Lesson<span class="title-bar"></span></h1></div>
      <div class="screen-progress"><div id="screen-fill"></div><span id="screen-label">Screen 1 of 1</span></div>
    </div>
    <div class="intro" id="intro"></div>

    <div class="text-box" id="text-box" tabindex="0">
      <div class="text-mascot" id="text-mascot"></div>
      <div class="text-line" id="text-line"></div>
      <div class="focus-hint" id="focus-hint"><b>Press any key to begin</b><span>Keep your eyes here, not on your hands</span></div>
    </div>

    <div class="hands-row">
      <div class="hand left"><span data-f="lp">pinky</span><span data-f="lr">ring</span><span data-f="lm">middle</span><span data-f="li">index</span></div>
      <div class="keyboard" id="keyboard"></div>
      <div class="hand right"><span data-f="ri">index</span><span data-f="rm">middle</span><span data-f="rr">ring</span><span data-f="rp">pinky</span></div>
    </div>

    <div class="player-actions">
      <button class="btn btn-ghost btn-small" id="restart-btn">↺ Restart screen</button>
      <label class="toggle"><input type="checkbox" id="kb-toggle" checked> Keyboard</label>
      <label class="toggle"><input type="checkbox" id="sound-toggle"> Sounds</label>
      <span class="err-pill" id="live-err">0 errors</span>
    </div>
  </section>
</main>

<div class="modal" id="result-modal" hidden>
  <div class="modal-box result">
    <div class="result-mascot" id="result-mascot"></div>
    <div class="result-stars" id="result-stars">★★★</div>
    <h2 id="result-title">Lesson complete!</h2>
    <div class="result-grid">
      <div style="--n:0"><small>Speed</small><b id="r-wpm">0</b><small>wpm</small></div>
      <div style="--n:1"><small>Accuracy</small><b id="r-acc">0%</b></div>
      <div style="--n:2"><small>Errors</small><b id="r-err">0</b></div>
      <div style="--n:3"><small>XP</small><b id="r-xp">0</b></div>
    </div>
    <p id="result-note" class="muted"></p>
    <div class="result-actions">
      <a class="btn btn-primary btn-lg" id="r-next" href="#">Next lesson ▶</a>
      <div class="row">
        <button class="btn btn-ghost btn-small" id="r-retry">↺ Try again</button>
        <a class="btn btn-ghost btn-small" href="index.html?done=1">All lessons</a>
        <a class="btn btn-gengo btn-small" href="https://praneet-admin.github.io/gengo/">Words on Gengo ↗</a>
      </div>
    </div>
  </div>
</div>

<script src="data.js?v=4"></script>
<script src="progress.js?v=4"></script>
<script src="effects.js?v=4"></script>
<script src="mascot.js?v=4"></script>
<script src="lesson.js?v=4"></script>
</body>
</html>
