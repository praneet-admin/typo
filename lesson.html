<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYPO — Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="lesson-page">
<header class="topnav">
  <a class="brand" href="index.html"><span class="brand-mark">⌨</span>TYPO</a>
  <div class="lesson-title-bar">
    <small id="unit-label">Unit</small>
    <b id="lesson-label">Lesson</b>
  </div>
  <div class="nav-right">
    <button class="btn btn-ghost" id="theme-toggle" title="Toggle dark mode">🌙</button>
    <a class="btn btn-gengo" href="https://praneet-admin.github.io/gengo/" title="Vocabulary trainer">言語 Gengo ↗</a>
    <a class="btn btn-light" href="index.html">✕ Exit</a>
  </div>
</header>

<main class="player">
  <div class="screen-progress"><div id="screen-fill"></div><span id="screen-label">Screen 1 of 1</span></div>

  <div class="live-stats">
    <div style="--n:0"><small>WPM</small><b id="live-wpm">0</b></div>
    <div style="--n:1"><small>Accuracy</small><b id="live-acc">100%</b></div>
    <div style="--n:2"><small>Errors</small><b id="live-err">0</b></div>
    <div style="--n:3"><small>Time</small><b id="live-time">0:00</b></div>
  </div>

  <div class="intro" id="intro"></div>

  <div class="text-box" id="text-box" tabindex="0">
    <div class="text-line" id="text-line"></div>
    <div class="focus-hint" id="focus-hint">Click here or press any key to begin</div>
  </div>

  <div class="hands-row">
    <div class="hand left" id="hand-left">
      <span data-f="lp">pinky</span><span data-f="lr">ring</span><span data-f="lm">middle</span><span data-f="li">index</span>
    </div>
    <div class="keyboard" id="keyboard"></div>
    <div class="hand right" id="hand-right">
      <span data-f="ri">index</span><span data-f="rm">middle</span><span data-f="rr">ring</span><span data-f="rp">pinky</span>
    </div>
  </div>

  <div class="player-actions">
    <button class="btn btn-light" id="restart-btn">↺ Restart screen</button>
    <label class="toggle"><input type="checkbox" id="kb-toggle" checked> Show keyboard</label>
    <label class="toggle"><input type="checkbox" id="sound-toggle"> Key sounds</label>
  </div>
</main>

<div class="modal" id="result-modal" hidden>
  <div class="modal-box result">
    <div class="result-stars" id="result-stars">★★★</div>
    <h2 id="result-title">Lesson complete!</h2>
    <div class="result-grid">
      <div style="--n:0"><small>Speed</small><b id="r-wpm">0</b><small>WPM</small></div>
      <div style="--n:1"><small>Accuracy</small><b id="r-acc">0%</b><small></small></div>
      <div style="--n:2"><small>Errors</small><b id="r-err">0</b><small></small></div>
      <div style="--n:3"><small>XP earned</small><b id="r-xp">0</b><small></small></div>
    </div>
    <p id="result-note"></p>
    <div class="result-actions">
      <button class="btn btn-light" id="r-retry">Try again</button>
      <a class="btn btn-light" href="index.html?done=1">All lessons</a>
      <a class="btn btn-gengo" href="https://praneet-admin.github.io/gengo/">Learn words on Gengo ↗</a>
      <a class="btn btn-primary" id="r-next" href="#">Next lesson ▶</a>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="progress.js"></script>
<script src="effects.js"></script>
<script src="lesson.js"></script>
</body>
</html>
